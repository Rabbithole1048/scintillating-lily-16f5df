<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Floatroom — touch the floating glass</title>
  <meta name="description" content="A playful room full of floating liquid-glass objects. Drag, fling, pinch, hold to grow, double-tap to shrink." />
  <meta name="theme-color" content="#0c0620" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-world">
      <div class="aura a1"></div>
      <div class="aura a2"></div>
      <div class="aura a3"></div>
      <div class="aura a4"></div>
      <div class="aura a5"></div>
      <div class="aura a6"></div>
      <div class="aura a7"></div>
      <div class="aura a8"></div>
      <div class="backdrop-scene scene-aurora"></div>
      <div class="backdrop-scene scene-ocean"></div>
      <div class="backdrop-scene scene-sunset"></div>
      <div class="distant-lights"></div>
      <div class="grain"></div>
    </div>
    <div class="grid"></div>
  </div>

  <div id="map-world">
    <main id="room" aria-label="Room of floating glass objects"></main>
  </div>

  <header class="top">
    <div class="brand glass-ui">
      <span class="logo-orbit" aria-hidden="true">
        <i class="logo-dot"></i><i class="logo-dot"></i><i class="logo-dot"></i>
        <i class="logo-dot"></i><i class="logo-dot"></i><i class="logo-dot"></i>
      </span>
      Floatroom
    </div>
    <div class="right">
      <button id="tilt" class="tilt glass-ui" type="button" aria-pressed="false" hidden>
        <span class="level" aria-hidden="true"><i></i></span><span class="label">tilt</span>
      </button>
      <div class="count glass-ui"><b id="count">0</b> floating</div>
    </div>
  </header>

  <div id="game-score" class="game-score glass-ui" aria-live="polite" aria-atomic="true" hidden>
    <span>Points <b id="game-points">0</b></span>
    <i aria-hidden="true"></i>
    <span>Hits <b id="game-stones">0</b></span>
    <i aria-hidden="true"></i>
    <span>Time <b id="game-time">60s</b></span>
    <i aria-hidden="true"></i>
    <span>Combo <b id="game-combo">0 / 3</b></span>
  </div>

  <div class="game-stats glass-ui" aria-live="polite" aria-atomic="true">
    <span>Goal <b>0 hidden</b></span>
    <i aria-hidden="true"></i>
    <span>Splits <b id="splits">0</b></span>
  </div>

  <div id="hint" class="hint hide" aria-live="polite">
    <span class="chip glass-ui">Bring matching forms together to split into four</span>
    <span class="chip glass-ui">Drag forces to move · select to pin or release</span>
  </div>

  <div class="dock">
    <div id="picker" class="picker glass-ui" role="dialog" aria-label="Choose a form or effect" hidden>
      <div class="picker-heading">
        <b id="picker-title">Choose a form</b>
        <button id="picker-close" class="picker-close" type="button" aria-label="Close picker">×</button>
      </div>
      <div id="picker-options" class="picker-options"></div>
      <p id="picker-hint" class="picker-hint">Drag a form into the room, or tap to add it.</p>
    </div>
    <div id="dock-actions" class="dock-actions">
      <button id="add" class="add glass-ui" type="button" aria-label="Choose forms" aria-expanded="false">
        <span class="orbit" aria-hidden="true">
          <span class="dot" style="--i:0"></span>
          <span class="dot" style="--i:1"></span>
          <span class="dot" style="--i:2"></span>
          <span class="dot" style="--i:3"></span>
          <span class="dot" style="--i:4"></span>
          <span class="dot" style="--i:5"></span>
        </span>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="button-label">Forms+</span>
      </button>
      <button id="more" class="add glass-ui" type="button" aria-label="Show more controls" aria-expanded="false" aria-controls="magic-menu">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Zm6 12 .9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span class="button-label">Magic</span>
      </button>
      <button id="game" class="add glass-ui game-button" type="button" aria-label="Start game" aria-pressed="false">
        <span class="button-plus" aria-hidden="true">◆</span>
        <span class="button-label" id="game-label">Game</span>
      </button>
      <button id="help-toggle" class="add glass-ui help-toggle" type="button" aria-label="Show help text" aria-pressed="false">
        <span class="button-plus" aria-hidden="true">?</span>
        <span class="button-label">Help</span>
      </button>
      <div id="magic-menu" class="magic-menu" hidden>
        <button id="elements" class="add glass-ui" type="button" aria-label="Choose a natural force">
          <span class="button-plus" aria-hidden="true">+</span>
          <span class="button-label">Elements</span>
        </button>
        <button id="light-effects" class="add glass-ui" type="button" aria-label="Choose a light effect">
          <span class="button-plus" aria-hidden="true">+</span>
          <span class="button-label">Light</span>
        </button>
        <button id="phenomena-effects" class="add glass-ui" type="button" aria-label="Choose a special effect">
          <span class="button-plus" aria-hidden="true">+</span>
          <span class="button-label">Effects</span>
        </button>
        <button id="draw-frame" class="add glass-ui" type="button" aria-label="Draw an object frame" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="m4 16.5 9.7-9.7a2.1 2.1 0 0 1 3 3L7 19.5 3.5 20.5 4 16.5Z M12.5 8.3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="button-label">Frame</span>
        </button>
        <button id="clear-forms" class="add glass-ui" type="button" aria-label="Clear Objects">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-.8 13H6.8L6 7m4 3v6m4-6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="button-label">Clear Objects</span>
        </button>
        <button id="clear-forces" class="add glass-ui" type="button" aria-label="Clear Forces">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-.8 13H6.8L6 7m4 3v6m4-6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="button-label">Clear Forces</span>
        </button>
        <button id="clear-frames" class="add glass-ui" type="button" aria-label="Clear Frames">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 4h16v16H4zM9 4v3m6-3v3M9 17v3m6-3v3M4 9h3m10 0h3M4 15h3m10 0h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="button-label">Clear Frames</span>
        </button>
        <button id="advanced" class="add glass-ui" type="button" aria-label="Advanced controls">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="button-label">Advanced</span>
        </button>
        <button id="speed" class="add glass-ui" type="button" aria-label="Simulation speed 1 times" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 5v14l11-7L4 5Zm12 0v14l5-3.2V8.2L16 5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span class="button-label" id="speed-label">1×</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
