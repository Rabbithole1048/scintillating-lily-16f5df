<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071a38"/>
      <stop offset="1" stop-color="#113f72"/>
    </linearGradient>
    <radialGradient id="orb" cx=".32" cy=".25" r=".8">
      <stop stop-color="#fff"/>
      <stop offset=".3" stop-color="#65e8ff"/>
      <stop offset=".72" stop-color="#397dff"/>
      <stop offset="1" stop-color="#a753ff"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#8bdfff" stroke-opacity=".38" stroke-width="4"/>
  <circle cx="256" cy="114" r="20" fill="#ff58b7" filter="url(#glow)"/>
  <circle cx="379" cy="185" r="24" fill="#43dfff" filter="url(#glow)"/>
  <circle cx="379" cy="327" r="18" fill="#ffe34f" filter="url(#glow)"/>
  <circle cx="256" cy="398" r="25" fill="#56ffbd" filter="url(#glow)"/>
  <circle cx="133" cy="327" r="19" fill="#ff8a52" filter="url(#glow)"/>
  <circle cx="133" cy="185" r="22" fill="#ae7bff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="88" fill="url(#orb)" stroke="#fff" stroke-opacity=".8" stroke-width="5" filter="url(#glow)"/>
  <ellipse cx="222" cy="220" rx="33" ry="17" fill="#fff" fill-opacity=".7" transform="rotate(-25 222 220)"/>
